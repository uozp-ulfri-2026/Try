<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konec označevanja</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .check { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .sub { color: #666; font-size: 15px; margin-bottom: 24px; line-height: 1.5; }
    .stats {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 28px;
    }
    .stat {
      background: #f5f5f5;
      border-radius: 10px;
      padding: 12px 16px;
      min-width: 80px;
    }
    .stat-n { font-size: 28px; font-weight: 700; }
    .stat-l { font-size: 12px; color: #888; margin-top: 2px; }
    .btn-export {
      display: block;
      background: #3b82f6;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .btn-export:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>Označevanje končano!</h1>
    <p class="sub">Vsi članki so pregledani.</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-n">{{ done }}</div>
        <div class="stat-l">označenih</div>
      </div>
      <div class="stat">
        <div class="stat-n">{{ skipped }}</div>
        <div class="stat-l">preskočenih</div>
      </div>
      <div class="stat">
        <div class="stat-n">{{ total }}</div>
        <div class="stat-l">skupaj</div>
      </div>
    </div>

    <a class="btn-export" href="/izvoz">⬇ Prenesi oznake (CSV)</a>
  </div>
</body>
</html>
